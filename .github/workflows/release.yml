name: Build Private Scanner Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Standalone Binaries
        run: npm run build
        env:
          SKIP_TESTS: "1"

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ac-private-binaries
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/AtlasAC.exe
            dist/AtlasAC-Linux
            dist/AtlasAC-Windows.zip
            dist/AtlasAC-Linux.zip
            dist/SHA256SUMS.txt

      - name: Publish to private Supabase Storage
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/octet-stream" \
            --header "x-upsert: true" \
            --data-binary @dist/AtlasAC-Windows.zip \
            "https://grxcdtcalukzhlqisbgr.supabase.co/storage/v1/object/atlas-downloads/AtlasAC-Windows.zip"
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/octet-stream" \
            --header "x-upsert: true" \
            --data-binary @dist/AtlasAC-Linux.zip \
            "https://grxcdtcalukzhlqisbgr.supabase.co/storage/v1/object/atlas-downloads/AtlasAC-Linux.zip"

name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Standalone Binaries
        run: npm run build
        env:
          SKIP_TESTS: "1"

      - name: Publish GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/AtlasAC.exe
            dist/AtlasAC-Linux
            dist/AtlasAC-Windows.exe
            dist/baslat.sh
            dist/SHA256SUMS.txt
          name: "Atlas AC v1.0.0 — Standalone Release"
          draft: false
          prerelease: false
          generate_release_notes: true

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06080d"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"><title>Giriş | Atlas AC</title><link rel="icon" type="image/x-icon" href="assets/atlas.ico"><link rel="shortcut icon" href="assets/atlas.ico"><link rel="stylesheet" href="assets/site.css"></head>
<body class="auth-page"><div class="ambient"></div><header class="nav shell"><a class="brand" href="index.html"><img class="brand-logo-img" src="assets/atlas_logo.png" alt="Atlas AC Logo"><span>ATLAS<small>ANTI-CHEAT</small></span></a><a class="button button-sm button-ghost" href="index.html">Ana sayfa</a></header><main class="auth-main"><section class="auth-card"><div class="auth-symbol"><img class="auth-logo-img" src="assets/atlas_icon_full.png" alt="Atlas AC"></div><span class="eyebrow"><span class="live-dot"></span> SECURE ACCOUNT ACCESS</span><h1 id="authTitle">Tekrar hoş geldiniz.</h1><p id="authSubtitle">Lisanslarınıza ve güvenli indirme alanına erişin.</p><div id="configWarning" class="config-warning hidden">Supabase bağlantısı henüz yapılandırılmadı.</div><div class="auth-tabs"><button id="loginTab" class="active" type="button">Giriş yap</button><button id="registerTab" type="button">Kayıt ol</button></div><form id="loginForm" class="form"><label>E-posta<input id="loginEmail" type="email" autocomplete="email" required placeholder="mail@sunucu.com"></label><label>Şifre<input id="loginPassword" type="password" autocomplete="current-password" minlength="10" required placeholder="••••••••••"></label><div id="loginStatus" class="form-status"></div><button class="button" type="submit">Kontrol paneline gir <span>→</span></button></form><form id="registerForm" class="form hidden"><label>Kullanıcı adı<input id="registerUsername" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required placeholder="yetkili_adı"></label><label>E-posta<input id="registerEmail" type="email" autocomplete="email" required placeholder="mail@sunucu.com"></label><label>Şifre<input id="registerPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="En az 10 karakter"></label><label>Yönetici davet anahtarı<input id="inviteKey" autocomplete="off" minlength="12" required placeholder="ATLAS-••••••••••••"></label><div id="registerStatus" class="form-status"></div><button class="button" type="submit">Hesabımı oluştur <span>→</span></button><small class="form-note">Kayıt yalnızca Atlas yöneticisinin verdiği geçerli davet anahtarıyla tamamlanır.</small></form></section></main><script type="module" src="assets/auth.js"></script></body></html>
